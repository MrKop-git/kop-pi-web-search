[package]
name = "pi-web-search-core"
version = "0.1.0"
edition = "2024"
description = "Rust core for kop-pi-web-search: Bing SERP + site APIs, parallel fetching, core-text extraction, sqlite-vec storage, confidence scoring"
license = "MIT"

[[bin]]
name = "pi-web-search"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "7.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
tracing = "0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "brotli", "deflate", "native-tls", "cookies", "blocking"] }
fastembed = { version = "7.1", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"], optional = true }

[features]
default = ["local-embed"]
local-embed = ["dep:fastembed"]

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
